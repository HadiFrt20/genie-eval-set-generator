# Default MLflow experiment, matching the NOTEBOOK's blank-widget default
# (/Users/<runner>/genie_eval_set_generator) so notebook-only runs land here without
# extra setup. The app's Configure page defaults to a per-space experiment instead
# (/Users/<user>/genie_eval_<space>) and either can be overridden per run.
resources:
  experiments:
    genie_eval_runs:
      name: /Users/${workspace.current_user.userName}/genie_eval_set_generator
